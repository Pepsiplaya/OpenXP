name: OpenXP tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lupa==2.8
      - run: python -u tests/run_tests.py
      - run: python tools/package.py "$RUNNER_TEMP"
